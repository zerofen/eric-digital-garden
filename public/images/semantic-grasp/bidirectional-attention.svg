<svg xmlns="http://www.w3.org/2000/svg" width="1520" height="720" viewBox="0 0 1520 720" role="img" aria-labelledby="title desc">
<title id="title">共享相似度矩阵的双向交叉注意力</title><desc id="desc">视觉和语言分别投影，一次计算 S=QK 转置除以根号 d。两个方向分别添加填充掩码并归一化，聚合另一模态的值；各自通过残差、层缩放、层归一化和独立 FFN。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/></marker></defs>
<style>text{font-family:Inter,Arial,"Microsoft YaHei","Noto Sans CJK SC",sans-serif;fill:#172b42}.muted{fill:#596b80}.mono{font-family:"Cascadia Code",Consolas,monospace}</style>
<rect width="1520" height="720" fill="white"/>
<text x="36" y="49" font-size="31" font-weight="700" text-anchor="start">Shared Similarity, Bidirectional Refinement</text>
<text x="36" y="84" font-size="21" font-weight="400" text-anchor="start" style="fill:#596b80">一次跨模态相似度计算，两路按各自序列归一化；每层维持独立的视觉与语言流。</text>
<rect x="32" y="118" width="1456" height="510" rx="18" fill="#f8fafc" stroke="#d4dee8" stroke-width="1.6"/>
<polyline points="224,264 279,264" fill="none" stroke="#64748b" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="224,469 279,469" fill="none" stroke="#64748b" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="539,249 580,249 580,356 620,356" fill="none" stroke="#64748b" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="539,454 580,454 580,394 620,394" fill="none" stroke="#64748b" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="880,355 920,355 920,226 964,226" fill="none" stroke="#64748b" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="880,395 920,395 920,478 964,478" fill="none" stroke="#64748b" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1195,226 1234,226" fill="none" stroke="#64748b" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="1195,478 1234,478" fill="none" stroke="#64748b" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<polyline points="539,493 558,493 558,163 1080,163 1080,185" fill="none" stroke="#79559b" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="760" y="155" font-size="18" font-weight="400" text-anchor="middle" style="fill:#79559b">语言值 V_l → 更新视觉</text>
<polyline points="539,293 601,293 601,585 1080,585 1080,553" fill="none" stroke="#245cb0" stroke-width="2.4" stroke-linejoin="round" marker-end="url(#arrow)"/>
<text x="760" y="575" font-size="18" font-weight="400" text-anchor="middle" style="fill:#245cb0">视觉值 V_v → 更新语言</text>
<rect x="56" y="206" width="168" height="116" rx="12" fill="#eaf1fd" stroke="#aac2e8" stroke-width="1.6"/>
<text x="140.0" y="240" font-size="22" font-weight="650" text-anchor="middle">视觉特征 v</text>
<text x="140.0" y="272" font-size="19" font-weight="400" text-anchor="middle" style="fill:#596b80">图像块序列</text>
<rect x="56" y="411" width="168" height="116" rx="12" fill="#f5f0fa" stroke="#d2bfdf" stroke-width="1.6"/>
<text x="140.0" y="445" font-size="22" font-weight="650" text-anchor="middle">语言特征 l</text>
<text x="140.0" y="477" font-size="19" font-weight="400" text-anchor="middle" style="fill:#596b80">文本词元序列</text>
<rect x="279" y="190" width="260" height="130" rx="12" fill="#eaf1fd" stroke="#aac2e8" stroke-width="1.6"/>
<text x="409.0" y="224" font-size="22" font-weight="650" text-anchor="middle">视觉投影</text>
<text x="409.0" y="256" font-size="19" font-weight="400" text-anchor="middle" style="fill:#596b80">Q = v W_q^v</text>
<text x="409.0" y="285" font-size="19" font-weight="400" text-anchor="middle" style="fill:#596b80">V_v = v W_v^v</text>
<rect x="279" y="395" width="260" height="130" rx="12" fill="#f5f0fa" stroke="#d2bfdf" stroke-width="1.6"/>
<text x="409.0" y="429" font-size="22" font-weight="650" text-anchor="middle">语言投影</text>
<text x="409.0" y="461" font-size="19" font-weight="400" text-anchor="middle" style="fill:#596b80">K = l W_k^l</text>
<text x="409.0" y="490" font-size="19" font-weight="400" text-anchor="middle" style="fill:#596b80">V_l = l W_v^l</text>
<rect x="620" y="302" width="260" height="141" rx="12" fill="#e6f5f1" stroke="#91cdbf" stroke-width="1.6"/>
<text x="750.0" y="336" font-size="22" font-weight="650" text-anchor="middle">共享相似度 S</text>
<text x="750.0" y="368" font-size="19" font-weight="400" text-anchor="middle" style="fill:#596b80">S = QKᵀ / √d</text>
<text x="750.0" y="397" font-size="19" font-weight="400" text-anchor="middle" style="fill:#596b80">复用 S 与 Sᵀ</text>
<rect x="964" y="185" width="231" height="131" rx="12" fill="#eaf1fd" stroke="#aac2e8" stroke-width="1.6"/>
<text x="1079.5" y="219" font-size="21" font-weight="650" text-anchor="middle">更新视觉 O_v</text>
<text x="1079.5" y="251" font-size="19" font-weight="400" text-anchor="middle" style="fill:#596b80">softmax(S + M_l) V_l</text>
<text x="1079.5" y="280" font-size="19" font-weight="400" text-anchor="middle" style="fill:#596b80">语言引导视觉聚焦</text>
<rect x="964" y="422" width="231" height="131" rx="12" fill="#f5f0fa" stroke="#d2bfdf" stroke-width="1.6"/>
<text x="1079.5" y="456" font-size="21" font-weight="650" text-anchor="middle">更新语言 O_l</text>
<text x="1079.5" y="488" font-size="19" font-weight="400" text-anchor="middle" style="fill:#596b80">softmax(Sᵀ + M_v) V_v</text>
<text x="1079.5" y="517" font-size="19" font-weight="400" text-anchor="middle" style="fill:#596b80">视觉反馈语义消歧</text>
<rect x="1234" y="171" width="230" height="164" rx="12" fill="#fff" stroke="#aac2e8" stroke-width="1.6"/>
<text x="1349.0" y="205" font-size="21" font-weight="650" text-anchor="middle">视觉流输出 v′</text>
<text x="1349.0" y="237" font-size="19" font-weight="400" text-anchor="middle" style="fill:#596b80">投影 · 层缩放 · 残差</text>
<text x="1349.0" y="266" font-size="19" font-weight="400" text-anchor="middle" style="fill:#596b80">LayerNorm + FFN_v</text>
<text x="1349.0" y="295" font-size="19" font-weight="400" text-anchor="middle" style="fill:#596b80">保留模态特异性</text>
<rect x="1234" y="408" width="230" height="164" rx="12" fill="#fff" stroke="#d2bfdf" stroke-width="1.6"/>
<text x="1349.0" y="442" font-size="21" font-weight="650" text-anchor="middle">语言流输出 l′</text>
<text x="1349.0" y="474" font-size="19" font-weight="400" text-anchor="middle" style="fill:#596b80">投影 · 层缩放 · 残差</text>
<text x="1349.0" y="503" font-size="19" font-weight="400" text-anchor="middle" style="fill:#596b80">LayerNorm + FFN_l</text>
<text x="1349.0" y="532" font-size="19" font-weight="400" text-anchor="middle" style="fill:#596b80">保留模态特异性</text>
<text x="36" y="666" font-size="21" font-weight="400" text-anchor="start" style="fill:#596b80">M_l / M_v 是序列填充掩码，区别于分割掩码 M；两个方向的注意力权重不要求互为转置。</text>
<text x="1480" y="704" font-size="16" font-weight="400" text-anchor="end" style="fill:#596b80">依据论文式 (1)–(2) 与图 4 重绘 · 省略多头重塑细节</text>
</svg>
